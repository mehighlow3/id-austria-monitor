name: ID Austria Slot Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: id-austria-monitor
  cancel-in-progress: false

jobs:
  check-slots:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore seen slots state
        uses: actions/cache/restore@v4
        with:
          path: seen_slots.json
          key: seen-slots-${{ github.run_id }}
          restore-keys: |
            seen-slots-

      - name: Poll ID Austria slots every 60s for 4.5 minutes
        run: python monitor.py --interval 60 --duration-seconds 270 --state-file seen_slots.json

      - name: Save seen slots state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: seen_slots.json
          key: seen-slots-${{ github.run_id }}
